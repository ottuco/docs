# Overrides for: components/schemas/ExtraInner
#
# The `extra` object of the Checkout and Invoice APIs. Ottu core describes it
# with the serializer's internal docstring, so the object description is
# replaced, and `app_name` gets the rules from Custom Data.

_description: |
  Your own key-value data. Any keys are accepted. Ottu validates only `app_name` and the custom fields set up for the plugin.

properties:
  app_name:
    description: |
      `Optional` field. The application that created the payment: `shopify`, `estate`, `event`, or your own identifier. A string of up to 64 characters. A number or any other type is rejected. Ottu trims and lower-cases it (`" Shopify "` is stored as `shopify`) and does not store `null`. The merchant sees it as **Application** in the dashboard. See [Application Name]({{apiBaseUrl}}/getting-started/api-fundamentals/#app-name).
