# Overrides for: components/schemas/AutoPaySubscription
# Returned by retrieve and cancel. Field semantics mirror SubscriptionOut in
# autopay/subscriptions/schemas.py.

_description: |
  A subscription as Ottu holds it right now. Returned by Retrieve a subscription and by Cancel a subscription.

  Read this object for the current state rather than caching what you sent at checkout. The customer's self-service link is deliberately not part of it; fetch that from the page-link endpoint.

properties:
  id:
    description: |
      The subscription's unique identifier. This is the same value returned as `extra.autopay.subscription_id` on the Checkout API response, and it is the `subscription_id` path parameter on every subscription endpoint.
  customer_id:
    description: |
      Your own identifier for the customer, exactly as you sent it in `customer_id` on the checkout call that created the subscription. Use it to filter the subscription list.
  customer_email:
    description: |
      The customer's email address, captured when the subscription was created. Ottu sends the pre-charge, payment-failed and final-failure emails to this address.
  customer_name:
    description: |
      The customer's name from the checkout call that created the subscription. An empty string if the checkout call had none.
  customer_phone:
    description: |
      The customer's phone number from the checkout call that created the subscription. An empty string if the checkout call had none.
  frequency:
    description: |
      How often the customer is charged. Enum: `monthly`, `yearly`.
  currency:
    description: |
      Three-letter ISO 4217 currency code that every recurring charge is made in, for example `KWD`. It is taken from the checkout transaction and cannot be changed afterwards.
  recurring_amount:
    description: |
      The amount charged on each billing cycle, as a decimal string in `currency`. It is independent of `first_payment_amount`.
  first_payment_amount:
    description: |
      The amount of the first, customer-initiated payment made at checkout, as a decimal string. `0` means the subscription started without a first charge (a free trial). `null` when no first payment applies.
  start_date:
    description: |
      The date billing starts from, in `YYYY-MM-DD` format. Its day of the month becomes the billing anchor: a subscription anchored on the 31st bills on the last day of shorter months.
  end_date:
    description: |
      The date after which Ottu stops billing, in `YYYY-MM-DD` format. `null` for an open-ended subscription. When it passes, the subscription moves to `expired`.
  billing_anchor_day:
    description: |
      The day of the month every charge is due, taken from `start_date`. In a month without that day, the charge falls on the month's last day.
  setup_session_id:
    description: |
      The checkout `session_id` of the first payment. The webhook for that payment carries the same `session_id`, so use it to match the webhook to this subscription.
  status:
    description: |
      The subscription's lifecycle state. One of `pending_setup` (created, first payment not completed yet), `trialing` (set up with a `0` first charge, waiting for its first billing date), `active` (billing normally), `past_due` (a billing cycle used up every retry), `canceled`, `expired` (the `end_date` passed), or `setup_failed` (the first payment never completed).

      A `past_due` subscription is never canceled automatically. See [Subscription States]({{apiBaseUrl}}/payments/autopay/#subscription-states).
  cancel_at_period_end:
    description: |
      `true` when a cancellation is scheduled for the end of the current paid period. The subscription keeps its current `status` until then. When the next billing date arrives, Ottu cancels the subscription and does not charge. `false` otherwise, including after an immediate cancellation.
  cancels_on:
    description: |
      When a cancellation is scheduled, the last day the customer keeps access: the day before the next charge. Ottu cancels the subscription the day after. `null` when no cancellation is scheduled, including after an immediate cancellation or a reactivation.
  canceled_at:
    description: |
      UTC timestamp of when the subscription became `canceled`. `null` while it is not canceled, including while a cancellation is only scheduled through `cancel_at_period_end`.
  cancellation_initiator:
    description: |
      Who most recently requested a cancellation: `merchant` when you called Cancel a subscription, `customer` when the customer used the self-service page. `null` if none was ever requested. It is set as soon as a cancellation is scheduled, and it is not cleared if the customer later reactivates the subscription, so read `status` and `cancel_at_period_end` to know whether the subscription is actually ending.
  cancellation_reason:
    description: |
      The reason the customer picked when canceling from the self-service page: `too_expensive`, `not_using`, `missing_feature`, `switched`, `temporary` or `other`. `null` when you canceled through the API or no reason was given.
  cancellation_note:
    description: |
      The free-text note the customer left when canceling from the self-service page. `null` when there is none.
  agreement_id:
    description: |
      The `agreement.id` you supplied on the checkout call. It ties every charge in the subscription to the same card-on-file agreement with the customer.
  amount_variability:
    description: |
      Taken from the agreement: `fixed` or `variable`. `null` until the first payment is confirmed.
  cycle_interval_days:
    description: |
      Taken from the agreement: the number of days between charges. `null` until the first payment is confirmed.
  total_cycles:
    description: |
      Taken from the agreement: the total number of charges it allows. `null` until the first payment is confirmed.
  notification_config:
    description: |
      The `autopay.notification_preferences` you sent at creation: `pre_charge_enabled`, `failure_enabled` and `final_failure_enabled`. `null` if you sent none, which leaves all three emails on.
  next_billing_date:
    description: |
      The date of the next scheduled charge, in `YYYY-MM-DD` format. `null` when no charge is scheduled.
  description:
    description: |
      The free-text label you sent in `autopay.description`, shown to the customer on the self-service page. `null` if you did not send one.
  merchant_reference:
    description: |
      Your checkout `order_no`, copied onto the subscription. `null` if the checkout call had none.
  plan_name:
    description: |
      Always an empty string for a subscription created through the Checkout API: the `autopay` block has no field for it.
  language:
    description: |
      `en` or `ar`, taken from the checkout `language` field at creation (default `en`). It sets the language of the customer's self-service page and of every email Ottu sends them.
  retry_count:
    description: |
      How many times Ottu retries a failed billing cycle before giving up, between 1 and 10. Retries run one hour apart. See [Retries & Dunning]({{apiBaseUrl}}/payments/autopay/#retries-and-dunning).
  created_at:
    description: |
      UTC timestamp of when the subscription was created, in ISO 8601 format.
  updated_at:
    description: |
      UTC timestamp of the last change to the subscription, in ISO 8601 format.
  card:
    description: |
      The card renewals are charged to: `masked_card` and `card_brand`. Never the card number or token. `null` until the first payment is confirmed. It changes when the customer updates their card on the self-service page.
  current_cycle:
    description: |
      The latest attempted billing cycle, with the same fields as a cycle in Retrieve billing cycles except `payment_attempts`. `null` while `pending_setup`, and for a `past_due` subscription once its period has ended.
