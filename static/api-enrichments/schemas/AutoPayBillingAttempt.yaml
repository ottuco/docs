# Overrides for: components/schemas/AutoPayBillingAttempt
# One charge attempt inside a billing cycle. Mirrors PaymentAttemptOut in AutoPay.

_description: |
  A single attempt to collect a billing cycle.

properties:
  attempt_number:
    description: |
      The position of this attempt within its cycle, starting at 1. It increases by one on each retry.
  session_id:
    description: |
      The Ottu `session_id` of the payment transaction created for this attempt.
  result:
    description: |
      The outcome of the attempt. `success` means the charge was collected. `failed` means it was declined or the gateway returned an error. `pending` means the charge was started and its outcome is not confirmed yet, which normally resolves within minutes. `null` before any outcome is recorded.
  created_at:
    description: |
      UTC timestamp of when Ottu started this attempt, in ISO 8601 format.
