name: Deploy to Staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.19.6"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test MCP + Webhook server
        run: |
          cd mcp-server
          npm install
          npm test

      - name: Generate API docs
        run: npm run gen-api

      - name: Build
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Trigger DigitalOcean App Platform Deployment
        id: deploy
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DO_APP_ID: ${{ secrets.DO_APP_ID_DEV }}
        run: |
          echo "Deploying to staging environment..."

          resp=$(curl -sS -X POST \
            -H "Authorization: Bearer $DO_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.digitalocean.com/v2/apps/$DO_APP_ID/deployments" \
            --fail-with-body)
          id=$(echo "$resp" | jq -r '.deployment.id')
          echo "Triggered deployment $id"
          echo "deployment_id=$id" >> "$GITHUB_OUTPUT"

      # Wait for the deployment to go live, then refresh the MCP index so search
      # reflects the just-published docs (the mcp loads the index from the public
      # URL at startup, which during a deploy is still the previous build).
      # Best-effort: this step must never fail the workflow.
      - name: Wait for deploy, then refresh MCP index
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DO_APP_ID: ${{ secrets.DO_APP_ID_DEV }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          # Sent on POST /mcp/refresh; the mcp service checks it once
          # MCP_REFRESH_TOKEN is set there too (#161374).
          MCP_REFRESH_TOKEN: ${{ secrets.MCP_REFRESH_TOKEN }}
        run: |
          app="$DO_APP_ID"
          id="$DEPLOYMENT_ID"
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "No deployment id — skipping refresh."; exit 0
          fi
          for _ in $(seq 1 60); do
            phase=$(curl -sS \
              -H "Authorization: Bearer $DO_TOKEN" \
              "https://api.digitalocean.com/v2/apps/$app/deployments/$id" \
              | jq -r '.deployment.phase')
            echo "deployment $id phase=$phase"
            case "$phase" in
              ACTIVE)
                echo "Deployment live — refreshing MCP index..."
                if curl -sS -X POST -H "x-mcp-refresh-token: $MCP_REFRESH_TOKEN" --fail-with-body https://docs.ottu.dev/mcp/refresh; then
                  echo " MCP index refreshed"
                else
                  echo " MCP index refresh failed (best-effort, ignored)"
                fi
                exit 0 ;;
              ERROR|CANCELED|SUPERSEDED)
                echo "Deployment ended as $phase — skipping refresh."; exit 0 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for ACTIVE — skipping refresh."; exit 0
